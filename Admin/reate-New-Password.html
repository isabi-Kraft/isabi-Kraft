<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Password</title>
    <link rel="stylesheet" href="Create-New-Password.css">
</head>
<body>
    <main>
        <section class="left">
            <img src="image.png" alt="">
            <h2>Create New Password</h2>
            <p>Your new password must be secure and distnict from previous credentials</p>
            <div>
                <label for="new" id="new">New Password</label>
                <input type="password" id="new">
            </div>
            <div>
                <label for="confirm">Confirm New Password</label>
                <input type="password" id="confirm">
            </div>
            <button>Reset Password</button>
        </section>
        <section class="right">
            <img src="lock.png" alt="">
            <h2>Almost there!</h2>
            <p>Create a strong combinations of number,letters and symbols to protect your isabi Kraft admin portal.</p>
        </section>
    </main>
    <script src="Create-New-Paswword.js"></script>
</body>
</html>
