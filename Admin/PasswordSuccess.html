<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Successful - iSabiKraft</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Google Font (Outfit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="PasswordSuccess.css">
</head>
<body>

  <main class="container">
    
    <!-- LEFT SECTION (Success Message & Login Button) -->
    <section class="left-section">
      <div class="logo-box">
        <img src="Images/Logo.png" alt="iSabiKraft Logo" class="logo">
      </div>

      <div class="content-wrapper">
        <!-- Success Checkbox Icon Box -->
        <div class="icon-box">
          <i class="fa-solid fa-check"></i>
        </div>

        <h1 class="title">Password Reset Successful!</h1>
        <p class="subtitle">
          Your new password has been saved. You can now log in to the admin portal with your new credentials.
        </p>

        <!-- Log In Now Button -->
        <a href="#" class="btn-primary">Log In Now</a>
      </div>
    </section>

    <!-- RIGHT SECTION (Green Illustration Area) -->
    <section class="right-section">
      <div class="badge"><i class="fa-solid fa-check"></i> COMPLETE</div>

      <div class="illustration-box">
        <img src="Images/pass.png" alt="Success Illustration" class="hero-image">
      </div>

      <div class="info-content">
        <h2 class="info-title">You're All Set!</h2>
        <p class="info-desc">
          Your iSabiKraft admin account is secure with your new password. Welcome back.
        </p>
      </div>
    </section>

  </main>

</body>
</html>
