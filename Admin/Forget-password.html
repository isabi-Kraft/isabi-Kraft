<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - iSabiKraft</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="Forget-password.css">
</head>
<body>

  <main class="container">
    
    <!-- LEFT SECTION (Form Area) -->
    <section class="left-section">
      <div class="logo-box">
        <img src="Images/Logo.png" alt="iSabiKraft Logo" class="logo">
      </div>

      <div class="form-wrapper">
        <h1 class="title">Reset your password</h1>
        <p class="subtitle">
          No worries! Enter the email address linked to your admin account and we’ll send a reset link.
        </p>

        <form>
          <div class="form-group">
            <label for="email" class="label">Email address</label>
            <div class="input-container">
              <i class="fa-regular fa-envelope input-icon"></i>
              <input 
                type="email" 
                id="email" 
                placeholder="chidima@example.com" 
                required
              >
            </div>
          </div>

          <button type="submit" class="btn-submit">Send Reset Link</button>
        </form>

        <p class="footer-text">
          Remember your password? <a href="#" class="link">Log In</a>
        </p>
      </div>
    </section>

    <!-- RIGHT SECTION -->
    <section class="right-section">
      <div class="badge">1 OF 3</div>

      <div class="illustration-box">
        <img src="Images/Lock.png" alt="Secure Account Recovery" class="hero-image">
      </div>

      <div class="info-content">
        <h2 class="info-title">Secure Account Recovery</h2>
        <p class="info-desc">
          No worries — it happens. Enter your admin email and we’ll send you a link to reset it.
        </p>
      </div>
    </section>

  </main>

</body>
</html>
